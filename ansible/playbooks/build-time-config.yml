- name: Configuration système au build-time
  hosts: default
  become: yes
  gather_facts: yes

  roles:
    - system-hardening

  tasks:
    - name: Créer le répertoire de l'application
      file:
        path: /var/www/myapp
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'
      when: image_type == 'web'

    - name: Message de build terminé
      debug:
        msg: "Image {{ image_type }} configurée avec succès"
