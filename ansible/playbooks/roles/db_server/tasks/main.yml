---
- name: Configuration du Database Server
  block:
    - name: Déterminer la version de PostgreSQL
      shell: ls /etc/postgresql/ | head -n1
      register: pg_version
      changed_when: false

    - name: Afficher la version PostgreSQL et le rôle
      debug:
        msg: "PostgreSQL version: {{ pg_version.stdout }} - Role: {{ db_role | default('unknown') }}"

# =============================================================================
# CONFIGURATION MASTER
# =============================================================================
- name: Configuration du Master PostgreSQL
  when: db_role == 'master'
  block:
    - name: Créer l'utilisateur de réplication
      become: yes
      become_user: postgres
      postgresql_user:
        name: replicator
        password: replicator_password
        role_attr_flags: REPLICATION,LOGIN
        state: present

    - name: Créer l'utilisateur applicatif
      become: yes
      become_user: postgres
      postgresql_user:
        name: devops_user
        password: devops_password
        encrypted: yes
        state: present

    - name: Créer la base de données
      become: yes
      become_user: postgres
      postgresql_db:
        name: devops_db
        owner: devops_user
        state: present

    - name: Créer la table users
      become: yes
      become_user: postgres
      postgresql_query:
        db: devops_db
        query: |
          CREATE TABLE IF NOT EXISTS users (
            id SERIAL PRIMARY KEY,
            name VARCHAR(100) NOT NULL,
            email VARCHAR(100) UNIQUE NOT NULL,
            created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          );

          INSERT INTO users (name, email) VALUES
          ('Alice Dupont', 'alice@example.com'),
          ('Bob Martin', 'bob@example.com'),
          ('Charlie Dubois', 'charlie@example.com')
          ON CONFLICT (email) DO NOTHING;

    - name: Accorder les privilèges sur la base de données
      become: yes
      become_user: postgres
      postgresql_privs:
        database: devops_db
        roles: devops_user
        privs: ALL
        type: database
        state: present

    - name: Accorder les privilèges sur la table users
      become: yes
      become_user: postgres
      postgresql_privs:
        database: devops_db
        roles: devops_user
        objs: users
        privs: SELECT,INSERT,UPDATE,DELETE
        type: table
        state: present

    - name: Accorder les privilèges sur la séquence
      become: yes
      become_user: postgres
      postgresql_privs:
        database: devops_db
        roles: devops_user
        objs: users_id_seq
        privs: SELECT,UPDATE
        type: sequence
        state: present

    - name: Configurer postgresql.conf pour le Master
      blockinfile:
        path: "/etc/postgresql/{{ pg_version.stdout }}/main/postgresql.conf"
        marker: "# {mark} ANSIBLE MANAGED - REPLICATION CONFIG"
        block: |
          listen_addresses = '*'
          wal_level = replica
          max_wal_senders = 5
          wal_keep_size = 128
          hot_standby = on
          synchronous_commit = on
      notify: restart postgresql

    - name: Configurer pg_hba.conf pour le Master
      blockinfile:
        path: "/etc/postgresql/{{ pg_version.stdout }}/main/pg_hba.conf"
        marker: "# {mark} ANSIBLE MANAGED - REPLICATION ACCESS"
        block: |
          # Connexions de réplication depuis le slave
          host    replication     replicator      {{ db_slave_ip }}/32       md5
          # Connexions applicatives
          host    all             all             0.0.0.0/0                  md5
      notify: restart postgresql

    - name: Redémarrer PostgreSQL Master
      systemd:
        name: postgresql
        state: restarted
        enabled: yes

    - name: Attendre que PostgreSQL Master soit prêt
      wait_for:
        port: 5432
        delay: 5
        timeout: 60

# =============================================================================
# CONFIGURATION SLAVE
# =============================================================================
- name: Configuration du Slave PostgreSQL
  when: db_role == 'slave'
  block:
    - name: Arrêter PostgreSQL sur le Slave
      systemd:
        name: postgresql
        state: stopped

    - name: Vérifier si la réplication est déjà configurée
      stat:
        path: "/var/lib/postgresql/{{ pg_version.stdout }}/main/standby.signal"
      register: standby_signal

    - name: Nettoyer le répertoire de données PostgreSQL
      when: not standby_signal.stat.exists
      file:
        path: "/var/lib/postgresql/{{ pg_version.stdout }}/main"
        state: absent

    - name: Recréer le répertoire de données
      when: not standby_signal.stat.exists
      file:
        path: "/var/lib/postgresql/{{ pg_version.stdout }}/main"
        state: directory
        owner: postgres
        group: postgres
        mode: '0700'

    - name: Effectuer pg_basebackup depuis le Master
      when: not standby_signal.stat.exists
      become: yes
      become_user: postgres
      environment:
        PGPASSWORD: replicator_password
      command: >
        pg_basebackup
        -h {{ db_master_ip }}
        -U replicator
        -D /var/lib/postgresql/{{ pg_version.stdout }}/main
        -Fp -Xs -P -R
      register: basebackup_result

    - name: Afficher le résultat du basebackup
      when: not standby_signal.stat.exists
      debug:
        var: basebackup_result

    - name: Configurer postgresql.conf pour le Slave (dans /etc)
      blockinfile:
        path: "/etc/postgresql/{{ pg_version.stdout }}/main/postgresql.conf"
        marker: "# {mark} ANSIBLE MANAGED - SLAVE CONFIG"
        block: |
          listen_addresses = '*'
          hot_standby = on
          max_wal_senders = 5
          wal_level = replica
          wal_keep_size = 128

    - name: Configurer primary_conninfo dans postgresql.auto.conf
      copy:
        content: |
          primary_conninfo = 'host={{ db_master_ip }} port=5432 user=replicator password=replicator_password'
        dest: "/var/lib/postgresql/{{ pg_version.stdout }}/main/postgresql.auto.conf"
        owner: postgres
        group: postgres
        mode: '0600'
      when: not standby_signal.stat.exists

    - name: S'assurer que standby.signal existe
      file:
        path: "/var/lib/postgresql/{{ pg_version.stdout }}/main/standby.signal"
        state: touch
        owner: postgres
        group: postgres
        mode: '0600'

    - name: Démarrer PostgreSQL Slave
      systemd:
        name: postgresql
        state: started
        enabled: yes

    - name: Attendre que PostgreSQL Slave soit prêt
      wait_for:
        port: 5432
        delay: 5
        timeout: 60

    - name: Vérifier le statut de réplication sur le Slave
      become: yes
      become_user: postgres
      postgresql_query:
        query: "SELECT pg_is_in_recovery();"
      register: recovery_status

    - name: Afficher le statut de réplication
      debug:
        msg: "Slave en mode recovery: {{ recovery_status.query_result[0].pg_is_in_recovery }}"

# =============================================================================
# VERIFICATION FINALE
# =============================================================================
- name: Vérification de la réplication (Master uniquement)
  when: db_role == 'master'
  block:
    - name: Attendre que le Slave se connecte (30s max)
      pause:
        seconds: 10

    - name: Vérifier les connexions de réplication
      become: yes
      become_user: postgres
      postgresql_query:
        query: "SELECT client_addr, state, sent_lsn, replay_lsn FROM pg_stat_replication;"
      register: replication_status
      ignore_errors: yes

    - name: Afficher le statut de réplication
      debug:
        msg: "Réplication status: {{ replication_status.query_result | default('Aucune connexion de réplication active') }}"
